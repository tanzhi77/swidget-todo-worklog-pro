<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作月历</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body class="calendar-page">
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="icon-wrap" viewBox="0 0 24 24"><path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4m2-2-2 2 2 2M3 18h4"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
      <symbol id="icon-notebook" viewBox="0 0 24 24"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M16 2v20"/></symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M12.6 2.6H5a2 2 0 0 0-2 2v7.6a2 2 0 0 0 .6 1.4l7.8 7.8a2 2 0 0 0 2.8 0l7.2-7.2a2 2 0 0 0 0-2.8l-7.8-7.8a2 2 0 0 0-1-.6Z"/><circle cx="8.5" cy="8.5" r="1.5"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    </svg>

    <div id="calendarLoading" class="loading-state">正在加载月历</div>

    <div id="calendarApp" class="calendar-shell" hidden>
      <header class="calendar-header">
        <div class="calendar-heading">
          <div class="calendar-title-row">
            <span class="calendar-logo"><svg><use href="#icon-calendar"/></svg></span>
            <div><h1>工作月历</h1><p id="calendarSummary"></p></div>
          </div>
          <div class="month-navigation">
            <button id="previousMonthButton" class="icon-button" type="button" title="上个月" aria-label="上个月"><svg><use href="#icon-chevron-left"/></svg></button>
            <button id="todayMonthButton" class="secondary-button compact" type="button">本月</button>
            <button id="nextMonthButton" class="icon-button" type="button" title="下个月" aria-label="下个月"><svg><use href="#icon-chevron-right"/></svg></button>
            <h2 id="monthTitle"></h2>
          </div>
        </div>
        <div class="calendar-actions">
          <button id="toggleWrapButton" class="icon-button" type="button" aria-label="事项自动换行" title="事项自动换行" aria-pressed="false"><svg><use href="#icon-wrap"/></svg></button>
          <button id="exportReportButton" class="secondary-button" type="button" title="导出双周报" aria-label="导出双周报"><svg><use href="#icon-notebook"/></svg><span>导出双周报</span></button>
          <button id="exportCsvButton" class="secondary-button" type="button"><svg><use href="#icon-download"/></svg><span>导出 CSV</span></button>
          <button id="closeCalendarButton" class="icon-button" type="button" title="关闭月历" aria-label="关闭月历"><svg><use href="#icon-x"/></svg></button>
        </div>
      </header>

      <div class="calendar-toolbar">
        <nav class="calendar-filters" aria-label="月历内容筛选">
          <button class="view-button active" type="button" data-calendar-filter="all">全部</button>
          <button class="view-button" type="button" data-calendar-filter="work">工作项</button>
          <button class="view-button" type="button" data-calendar-filter="completed">已办</button>
        </nav>
        <label class="search-field calendar-search"><svg><use href="#icon-search"/></svg><input id="calendarSearch" type="search" placeholder="搜索本月" aria-label="搜索本月" /></label>
        <select id="calendarTagFilter" aria-label="标签筛选"><option value="all">全部标签</option></select>
        <span id="holidayScheduleStatus" class="holiday-schedule-status" aria-live="polite"></span>
      </div>

      <main class="calendar-layout">
        <section class="month-panel" aria-label="月历">
          <div class="weekday-row" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
          <div id="monthGrid" class="month-grid"></div>
        </section>

        <aside class="day-detail" aria-labelledby="selectedDateTitle">
          <header class="day-detail-header">
            <div><h2 id="selectedDateTitle"></h2><p id="selectedDateSummary"></p></div>
            <button id="addCalendarWorkButton" class="primary-icon-button" type="button" title="补录工作项" aria-label="补录工作项"><svg><use href="#icon-plus"/></svg></button>
          </header>
          <div id="dayEntryList" class="day-entry-list"></div>
          <form id="calendarWorkForm" class="calendar-work-form" autocomplete="off" hidden>
            <h3 id="calendarWorkFormTitle">补录工作项</h3>
            <label>标题<input id="calendarWorkTitle" type="text" maxlength="200" required /></label>
            <label>工作日期<input id="calendarWorkDate" type="text" data-picker="date" placeholder="YYYY-MM-DD" required /></label>
            <label>标签<input id="calendarWorkTags" type="text" maxlength="300" placeholder="使用逗号分隔" /></label>
            <label>备注<textarea id="calendarWorkNotes" maxlength="2000" rows="3"></textarea></label>
            <div class="form-actions"><button id="deleteCalendarWorkButton" class="danger-text-button" type="button" hidden>删除</button><span></span><button id="cancelCalendarWorkButton" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit">保存</button></div>
          </form>
        </aside>
      </main>
    </div>

    <div id="reportBackdrop" class="overlay" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
        <header class="drawer-header"><h2 id="reportTitle">导出双周报</h2><button id="closeReportButton" class="icon-button" type="button" title="关闭" aria-label="关闭双周报"><svg><use href="#icon-x"/></svg></button></header>
        <form id="reportForm" class="editor-form">
          <div class="form-grid two-columns">
            <label>开始日期<input id="reportStart" type="text" data-picker="date" placeholder="YYYY-MM-DD" required /></label>
            <label>结束日期<input id="reportEnd" type="text" data-picker="date" placeholder="YYYY-MM-DD" required /></label>
          </div>
          <div class="report-range-presets" role="group" aria-label="双周快捷选择">
            <button id="reportFirstWeek" class="tab-button" type="button" aria-pressed="true">本周为第一周</button>
            <button id="reportSecondWeek" class="tab-button" type="button" aria-pressed="false">本周为第二周</button>
          </div>
          <label>工作项预览<textarea id="reportPreview" rows="10" readonly></textarea></label>
          <p id="reportStatus" role="status"></p>
          <div class="form-actions report-actions"><button id="cancelReportButton" class="secondary-button" type="button">取消</button><button id="copyReportButton" class="secondary-button" type="button"><svg><use href="#icon-copy"/></svg>复制</button><button id="saveReportButton" class="primary-button" type="submit">导出 TXT</button></div>
        </form>
      </section>
    </div>
    <div id="calendarToast" class="toast" role="status" hidden><span id="calendarToastMessage"></span><button id="calendarUndoButton" class="text-button" type="button" hidden>撤销</button></div>

    <script src="safe-select.js"></script><script src="safe-datetime.js"></script>
    <script src="todo-core.js"></script>
    <script src="china-holidays.js"></script>
    <script src="todo-calendar.js"></script>
  </body>
</html>
